[package]
name = "daedalus-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "daedalus_cli"
path = "src/lib.rs"

[[bin]]
name = "daedalus"
path = "src/bin/daedalus.rs"

[[bin]]
name = "daedalus-tui"
path = "src/bin/daedalus-tui.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde_json = "1"
thiserror = "2"
toml_edit = "0.23"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
