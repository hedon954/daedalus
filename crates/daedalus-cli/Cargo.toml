[package]
name = "daedalus-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "daedalus_cli"
path = "src/lib.rs"

[[bin]]
name = "daedalus"
path = "src/bin/daedalus.rs"

[[bin]]
name = "daedalus-tui"
path = "src/bin/daedalus-tui.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
enum_dispatch = "0.3.13"
ratatui = "0.29"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
toml_edit = "0.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
