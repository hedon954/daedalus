[package]
name = "codex-mini-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
openai_tool_project = { git = "https://github.com/hedon-rust-road/openai_tool_project" }
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1.89"
derive_builder = "0.20.2"
futures-core = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.13.3", default-features = false, features = [
    "json",
    "stream",
    "rustls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "process",
    "time",
    "io-util",
] }
schemars = "1.2.1"
dashmap = "6.2.1"
uuid = { version = "1.23.2", features = ["v4"] }
ratatui = "0.30.1"
tui-markdown = { version = "0.3.7", default-features = false }
