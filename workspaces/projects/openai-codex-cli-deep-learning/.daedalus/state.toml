# daedalus repo learning project state. 保留注释；确定性字段由 CLI 更新。
#
# Project state 只描述长期学习项目本身，不承载 10-stage 专题进度。
# 专题进度写在 `topics/<slug>/.daedalus/state.toml`。
#
# 枚举约束：
# - task.lifecycle 只能是：active、idle、abandoned。
# - task.workspace_bucket 固定为：projects。
# - project.active_topic 必须指向 `[[topics]]` 中存在的 topic slug。
# - topics.lifecycle 只能是：planned、active、blocked、completed、abandoned、skipped。
# - transition.action 只能是：init、topic-new、topic-activate、topic-complete、topic-abandon、migrate、task-complete、abandon。
# Agent 不要发明新的枚举值；如需新增，先修改 Rust 领域模型、模板和测试。

[task]
name = "openai-codex-cli-deep-learning"
kind = "repo-learning"
created_at = "2026-05-09 15:58:52"
lifecycle = "idle"
workspace_bucket = "projects"
next_action = "当前没有 active topic，但存在 awaiting-reflection topic；可以用大块时间完成 closeout reflection，或用 `daedalus topic new` / `daedalus topic activate` 启动新专题。"

[project]
mode = "multi-topic"
active_topic = ""
source_kind = "repo"
source_name = ""

[[topics]]
slug = "tools-permissions"
