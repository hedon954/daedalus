# daedalus course learning project state. 保留注释；确定性字段由 CLI 更新。
#
# Project state 只描述长期课程学习项目本身，不承载专题阶段进度。
# 专题进度写在 `topics/<slug>/.daedalus/state.toml`。
#
# 枚举约束：
# - task.lifecycle 只能是：active、idle、abandoned。
# - task.workspace_bucket 固定为：projects。
# - project.active_topic 必须指向 `[[topics]]` 中存在的 topic slug。
# - topics.lifecycle 只能是：planned、active、blocked、awaiting-reflection、completed、abandoned、skipped。
# - transition.action 只能是：init、topic-new、topic-activate、topic-await-reflection、topic-complete、topic-abandon、migrate、task-complete、abandon。
# Agent 不要发明新的枚举值；如需新增，先修改 Rust 领域模型、模板和测试。

[task]
name = "hugging-face-llm-course"
kind = "course-learning"
created_at = "2026-06-14 14:42:45"
lifecycle = "active"
workspace_bucket = "projects"
next_action = "继续 course-learning active topic `lora-feedback-loop`，按课程阶段推进下一份 guide。"

[project]
mode = "multi-topic"
active_topic = "lora-feedback-loop"
source_kind = "course"
source_name = "hugging-face-llm-course"
course_url = "https://huggingface.co/learn/llm-course/en"

[[topics]]
slug = "lora-feedback-loop"
title = "LoRA 微调与数据反馈闭环"
lifecycle = "active"
path = "topics/lora-feedback-loop"
inherits = []

[[transitions]]
stage = "project"
action = "init"
timestamp = "2026-06-14 14:42:45"
actor = "daedalus-cli"
reason = "初始化 course learning project，并创建初始专题 `lora-feedback-loop`。"

[[transitions]]
stage = "project"
action = "migrate"
timestamp = "2026-06-23 00:53:42"
actor = "daedalus-cli"
reason = "确认项目使用 course-learning 语义。"
